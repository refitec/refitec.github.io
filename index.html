 noise elimination"]},{n:"02",title:"Refrigerator Repair",icon:"fridge",price:"From KSh 3,000",desc:"Expert refrigerator and freezer repair for single-door, double-door, side-by-side, French-door and deep freezers. We resolve no-cooling, over-freezing, ice build-up, compressor failure, thermostat inaccuracy, defrost heater faults, fan motor seizure, door gasket leaks, water dispenser and ice-maker issues. Our team handles refrigerant gas recharging, leak detection, relay and overload replacement, and electronic control board troubleshooting for energy-efficient operation. We use genuine compressors, thermistors and timers to extend food preservation and cut power bills. Serving all Nairobi estates with on-site diagnosis, we restore optimal temperatures within hours, clean condenser coils and advise on ventilation to prevent repeat failures, backed by warranty.",points:["Compressor & gas recharge","No-cooling & thermostat fix","Defrost system repair","Door gasket replacement"]},{n:"03",title:"Cooker Repair",icon:"cooker",price:"From KSh 2,000",desc:"Professional cooker repair for gas, electric, induction and dual-fuel free-standing and built-in cookers. We fix gas burners not lighting, weak flames, gas leaks, faulty ignition coils, thermocouple and safety valve failure, electric element burnout, selector switch defects and oven not heating due to cooker wiring. Our GasSafe-trained technicians test pressure, replace jets, clean clogged burners, repair spark generators and calibrate temperature for even cooking. We stock genuine knobs, hinges, ignition switches and glass tops for rapid restoration. With strict safety checks, leak testing and ventilation guidance, we ensure your kitchen is safe, efficient and compliant. Same-day service in Nairobi with 90-day warranty on all cooker repairs and parts.",points:["Gas leak detection & sealing","Burner & ignition repair","Heating element replacement","Safety valve & thermostat"]},{n:"04",title:"Oven Repair",icon:"oven",price
